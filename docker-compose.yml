services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: pulsegrid, POSTGRES_USER: pulsegrid, POSTGRES_PASSWORD: pulsegrid }
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pulsegrid"], interval: 5s, timeout: 3s, retries: 15 }

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment: { CLICKHOUSE_DB: pulsegrid, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1 }
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./backend/src/main/resources/schema-clickhouse.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck: { test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"], interval: 5s, timeout: 3s, retries: 15 }

  kafka:
    image: apache/kafka:4.3.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on: { kafka: { condition: service_healthy } }
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--create", "--if-not-exists", "--topic", "pulsegrid.telemetry.v1", "--partitions", "6", "--replication-factor", "1"]

  backend:
    build: ./backend
    environment:
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/pulsegrid
      POSTGRES_USER: pulsegrid
      POSTGRES_PASSWORD: pulsegrid
      CLICKHOUSE_URL: http://clickhouse:8123
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET: local-compose-secret-change-before-production-123456
      DEVICE_SHARED_SECRET: dev-only-change-me
      DASHBOARD_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"], interval: 5s, timeout: 3s, retries: 20 }

  simulator:
    build: ./simulator
    command: ["--host", "backend", "--devices", "1000", "--rate", "20", "--workers", "4", "--batch", "100", "--device-secret", "dev-only-change-me"]
    depends_on: { backend: { condition: service_healthy } }
    restart: unless-stopped

  alerting:
    build: ./alerting
    environment:
      GATEWAY_URL: http://backend:8080
      ALERT_LISTEN_ADDR: ":8090"
      ALERT_POLL_INTERVAL: 5s
    ports: ["8090:8090"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    build:
      context: .
      args:
        # Baked into the client bundle: the browser reaches the gateway on the
        # host port, not on the compose network.
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: { backend: { condition: service_healthy } }

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-pulsegrid}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3001:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  k6:
    image: grafana/k6:0.56.0
    profiles: ["load-test"]
    environment:
      BASE_URL: http://backend:8080
      DEVICE_SECRET: dev-only-change-me
      TARGET_RPS: ${TARGET_RPS:-10000}
      TEST_DURATION: ${TEST_DURATION:-30s}
    volumes:
      - ./load-tests:/scripts
    command: ["run", "/scripts/telemetry.js"]
    depends_on: { backend: { condition: service_healthy } }

volumes:
  postgres-data:
  clickhouse-data:
  kafka-data:
  prometheus-data:
  grafana-data:
