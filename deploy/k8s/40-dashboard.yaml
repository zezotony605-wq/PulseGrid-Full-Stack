apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsegrid-dashboard
  namespace: pulsegrid
  labels:
    app.kubernetes.io/name: pulsegrid-dashboard
    app.kubernetes.io/part-of: pulsegrid
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsegrid-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsegrid-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: dashboard
          # NEXT_PUBLIC_* is compiled in, so the gateway URL is chosen when the
          # image is built, not here.
          image: ghcr.io/zezotony605-wq/pulsegrid-dashboard:latest
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pulsegrid-dashboard
  namespace: pulsegrid
spec:
  selector:
    app.kubernetes.io/name: pulsegrid-dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsegrid
  namespace: pulsegrid
spec:
  rules:
    - host: pulsegrid.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pulsegrid-backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: pulsegrid-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulsegrid-dashboard
                port:
                  number: 3000
